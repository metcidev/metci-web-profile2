<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metci DB Bot • v26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

        body {
            font-family: 'Inter', system_ui, sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .tech-bg {
            background-color: #0a0f1a;
            background-image: 
                linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .section-header {
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            color: #64748b;
        }

        .data-row {
            transition: all 0.2s ease;
        }

        .data-row:hover {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: #334155;
        }

        .metric-value {
            font-variant-numeric: tabular-nums;
        }

        .profile-card {
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4),
                        0 10px 10px -6px rgb(0 0 0 / 0.3);
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .status-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#0a0f1a] text-slate-200 tech-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-[420px]">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-database text-white text-2xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-x-2">
                        <h1 class="font-semibold text-2xl tracking-tight">Metci DB Bot</h1>
                        <span class="px-2 py-0.5 text-[10px] font-mono bg-slate-800 text-cyan-400 rounded-lg border border-slate-700">v26</span>
                    </div>
                    <div class="flex items-center gap-x-1.5 -mt-0.5">
                        <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full status-dot"></div>
                        <span class="text-emerald-400 text-xs font-medium tracking-wider">ONLINE • LIVE</span>
                    </div>
                </div>
            </div>
            
            <div class="text-right">
                <div class="text-[10px] text-slate-500">SON GÜNCELLEME</div>
                <div id="timestamp" class="font-mono text-xs text-slate-400"></div>
            </div>
        </div>

        <!-- Main Card -->
        <div id="profile-card"
             class="glass rounded-3xl p-6 shadow-2xl profile-card border border-slate-700/60">
            
            <!-- Platform Badge -->
            <div class="flex justify-between items-center mb-5">
                <div id="platform-badge"
                     class="inline-flex items-center gap-x-2 px-4 h-8 rounded-2xl text-sm font-semibold border">
                    <!-- JS ile doldurulacak -->
                </div>
                
                <div class="px-3 py-1 bg-slate-900/70 rounded-2xl text-[10px] font-mono flex items-center gap-x-1.5 border border-slate-700">
                    <i class="fa-solid fa-globe text-cyan-400"></i>
                    <span class="text-cyan-400">LIVE</span>
                </div>
            </div>

            <!-- ID + Avatar -->
            <div class="flex items-center gap-x-4 mb-6">
                <div id="avatar"
                     class="w-16 h-16 rounded-2xl flex-shrink-0 flex items-center justify-center text-4xl font-bold border border-slate-600 shadow-inner">
                    <!-- JS ile doldurulacak -->
                </div>
                
                <div class="flex-1 min-w-0">
                    <div id="main-id"
                         class="font-mono text-[26px] font-semibold tracking-[-1.5px] text-white break-all leading-none">
                    </div>
                    <div id="main-subtitle"
                         class="text-slate-400 text-sm mt-1 font-medium">
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="stat-box rounded-2xl p-3 text-center border border-slate-700/50">
                    <div class="section-header mb-1">BEĞENİ</div>
                    <div id="likes-count" class="text-3xl font-semibold text-emerald-400 metric-value">0</div>
                </div>
                
                <div class="stat-box rounded-2xl p-3 text-center border border-slate-700/50">
                    <div class="section-header mb-1">ARAMA</div>
                    <div id="search-count" class="text-3xl font-semibold text-amber-400 metric-value">0</div>
                </div>
                
                <div class="stat-box rounded-2xl p-3 text-center border border-slate-700/50">
                    <div class="section-header mb-1">PLATFORM</div>
                    <div id="platform-short" class="text-2xl font-bold text-cyan-400">—</div>
                </div>
            </div>

            <!-- Data Rows -->
            <div class="space-y-[1px] mb-6">
                <div class="section-header px-1 mb-2 tracking-[0.5px]">KAYITLI BİLGİLER</div>
                
                <div class="data-row flex items-center justify-between px-4 py-[13px] rounded-2xl border border-slate-700 bg-slate-900/40">
                    <div class="flex items-center gap-x-3">
                        <i class="fa-solid fa-phone text-emerald-400 w-4"></i>
                        <span class="text-sm text-slate-300">Telefon</span>
                    </div>
                    <div id="phone-value" class="font-mono text-sm text-white font-medium">—</div>
                </div>
                
                <div class="data-row flex items-center justify-between px-4 py-[13px] rounded-2xl border border-slate-700 bg-slate-900/40">
                    <div class="flex items-center gap-x-3">
                        <i class="fa-solid fa-user text-sky-400 w-4"></i>
                        <span class="text-sm text-slate-300">Kullanıcı Adı</span>
                    </div>
                    <div id="username-value" class="font-mono text-sm text-white font-medium truncate max-w-[150px]">—</div>
                </div>
                
                <div class="data-row flex items-center justify-between px-4 py-[13px] rounded-2xl border border-slate-700 bg-slate-900/40">
                    <div class="flex items-center gap-x-3">
                        <i class="fa-solid fa-calendar text-amber-400 w-4"></i>
                        <span class="text-sm text-slate-300">Kayıt Tarihi</span>
                    </div>
                    <div id="date-value" class="font-mono text-sm text-white font-medium">—</div>
                </div>
            </div>

            <!-- Extra Info -->
            <div id="extra-section" class="hidden mb-5">
                <div class="section-header px-1 mb-2">EK BİLGİLER</div>
                <div id="extra-content"
                     class="text-sm text-slate-300 bg-slate-900/60 border border-slate-700 rounded-2xl p-4 leading-relaxed text-[13px]">
                </div>
            </div>

            <!-- Footer -->
            <div class="pt-4 border-t border-slate-700/60 flex flex-col gap-y-2.5">
                <a href="https://t.me/dehsetmis" target="_blank"
                   class="flex items-center justify-center gap-x-2 bg-white hover:bg-slate-100 active:bg-slate-200 transition-all text-slate-900 font-semibold py-3.5 rounded-2xl text-sm">
                    <i class="fa-brands fa-telegram text-lg"></i>
                    <span>Telegram'da İletişime Geç</span>
                </a>
                
                <button onclick="copyCurrentLink()"
                        class="flex items-center justify-center gap-x-2 border border-slate-600 hover:bg-slate-800 active:bg-slate-700 transition-colors text-slate-300 font-medium py-3 rounded-2xl text-sm">
                    <i class="fa-solid fa-link"></i>
                    <span>Profil Linkini Kopyala</span>
                </button>
            </div>
        </div>

        <div class="mt-4 text-center">
            <p class="text-[10px] text-slate-500">
                Metci DB Bot v26 • Profesyonel Sorgu Sistemi
            </p>
        </div>
    </div>

    <script>
        function initializeTailwind() {
            document.documentElement.classList.add('dark');
        }

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                uid: params.get('uid') || 'Bilinmiyor',
                platform: params.get('platform') || 'tg',
                likes: parseInt(params.get('likes')) || 0,
                count: parseInt(params.get('count')) || 0,
                phone: params.get('phone') || null
            };
        }

        function formatTimestamp() {
            const now = new Date();
            return now.toLocaleDateString('tr-TR', { 
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function updateProfile(params) {
            const { uid, platform, likes, count, phone } = params;

            const badge = document.getElementById('platform-badge');
            const avatar = document.getElementById('avatar');
            const platformShort = document.getElementById('platform-short');

            if (platform === 'ig') {
                badge.innerHTML = `<i class="fa-brands fa-instagram text-pink-400"></i> <span class="font-semibold text-pink-400">Instagram</span>`;
                badge.className = `inline-flex items-center gap-x-2 px-4 h-8 rounded-2xl text-sm font-semibold bg-pink-500/10 border border-pink-500/30 text-pink-400`;
                avatar.innerHTML = `<i class="fa-brands fa-instagram text-[42px] text-pink-400"></i>`;
                avatar.className = `w-16 h-16 rounded-2xl flex-shrink-0 flex items-center justify-center text-3xl font-bold border border-pink-500/30 bg-pink-500/10`;
                platformShort.textContent = 'IG';
                platformShort.className = 'text-2xl font-bold text-pink-400';
            } else {
                badge.innerHTML = `<i class="fa-brands fa-telegram text-cyan-400"></i> <span class="font-semibold text-cyan-400">Telegram</span>`;
                badge.className = `inline-flex items-center gap-x-2 px-4 h-8 rounded-2xl text-sm font-semibold bg-cyan-500/10 border border-cyan-500/30 text-cyan-400`;
                avatar.innerHTML = `<i class="fa-solid fa-user text-[42px] text-cyan-400"></i>`;
                avatar.className = `w-16 h-16 rounded-2xl flex-shrink-0 flex items-center justify-center text-3xl font-bold border border-cyan-500/30 bg-cyan-500/10`;
                platformShort.textContent = 'TG';
                platformShort.className = 'text-2xl font-bold text-cyan-400';
            }

            document.getElementById('main-id').textContent = uid;
            document.getElementById('main-subtitle').textContent = platform === 'ig' ? 'Instagram Profili' : 'Kayıtlı Kullanıcı';
            document.getElementById('likes-count').textContent = likes.toLocaleString('tr-TR');
            document.getElementById('search-count').textContent = count.toLocaleString('tr-TR');
            document.getElementById('timestamp').textContent = formatTimestamp();

            const phoneEl = document.getElementById('phone-value');
            if (phone) {
                phoneEl.textContent = phone;
                phoneEl.className = 'font-mono text-sm text-emerald-400 font-medium';
            } else {
                phoneEl.textContent = 'Kayıtlı değil';
                phoneEl.className = 'font-mono text-sm text-slate-400';
            }

            document.getElementById('username-value').textContent = uid.startsWith('@') ? uid : (platform === 'ig' ? '@' + uid : uid);
            document.getElementById('date-value').textContent = formatTimestamp().split(' ')[0];

            const extraSection = document.getElementById('extra-section');
            const extraContent = document.getElementById('extra-content');

            if (platform === 'ig') {
                extraSection.classList.remove('hidden');
                extraContent.innerHTML = `Bu profil Instagram üzerinden sorgulanmıştır.<br>Detaylı bilgiler için Telegram botunu kullanın.`;
            } else if (count > 10) {
                extraSection.classList.remove('hidden');
                extraContent.innerHTML = `Bu kimlik numarası sistemde <span class="text-amber-400">${count}</span> kez aratılmıştır.`;
            } else {
                extraSection.classList.add('hidden');
            }
        }

        function copyCurrentLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert("Link kopyalandı!");
            }).catch(() => {
                prompt("Linki kopyala:", url);
            });
        }

        function initialize() {
            document.documentElement.classList.add('dark');
            const params = getQueryParams();
            updateProfile(params);
        }

        window.onload = initialize;
    </script>
</body>
</html>
